<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Divine">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Divine — She Moves Different</title>
  <style>
    :root {
      --skin:        #C1824F;
      --skin-shadow: #9E6434;
      --hair:        #1C0900;
      --hair-hi:     #3B1A00;
      --purple:      #7B2D8B;
      --purple-lt:   #9B4DB3;
      --gold:        #FFD700;
      --gold-dim:    #CC9A00;
      --bg-dark:     #08011A;
      --bg-mid:      #1A0533;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
    }

    body {
      min-height: 100dvh;
      background: radial-gradient(ellipse at 40% 20%, var(--bg-mid) 0%, var(--bg-dark) 65%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      touch-action: manipulation;
    }

    /* ── AMBIENT LIGHTS ── */
    .ambient {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      animation: amb-pulse ease-in-out infinite alternate;
    }
    .amb-1 { width: 340px; height: 340px; background: rgba(123,45,139,0.28); top: -100px; left: -80px; animation-duration: 3.2s; }
    .amb-2 { width: 260px; height: 260px; background: rgba(255,215,0,0.09);  bottom: -60px; right: -60px; animation-duration: 4.1s; animation-delay: 1.1s; }
    .amb-3 { width: 220px; height: 220px; background: rgba(255,100,180,0.1); top: 35%; right: -50px; animation-duration: 3.7s; animation-delay: 0.6s; }
    @keyframes amb-pulse {
      from { opacity: 0.55; transform: scale(0.88); }
      to   { opacity: 1.00; transform: scale(1.12); }
    }

    /* ── DISCO FLOOR ── */
    .floor {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 38%;
      overflow: hidden;
      pointer-events: none;
    }
    .floor-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(155,77,179,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(155,77,179,0.1) 1px, transparent 1px);
      background-size: 38px 38px;
      transform: perspective(320px) rotateX(58deg);
      transform-origin: top center;
    }
    .floor-glow {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 240px; height: 70px;
      background: radial-gradient(ellipse, rgba(123,45,139,0.45), transparent 70%);
    }

    /* ── MUSIC NOTES ── */
    .note {
      position: fixed;
      font-size: 1.4rem;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: note-rise linear infinite;
      filter: drop-shadow(0 0 7px currentColor);
    }
    @keyframes note-rise {
      0%   { transform: translateY(0)    rotate(0deg)  scale(0.7); opacity: 0; }
      12%  { opacity: 0.95; }
      82%  { opacity: 0.65; }
      100% { transform: translateY(-62vh) rotate(28deg) scale(1.1); opacity: 0; }
    }

    /* ── SPARKLES ── */
    .sparkle {
      position: fixed;
      width: 5px; height: 5px;
      border-radius: 50%;
      pointer-events: none;
      animation: sparkle-blink ease-in-out infinite;
    }
    @keyframes sparkle-blink {
      0%,100% { opacity: 0; transform: scale(0.4); }
      50% { opacity: 1; transform: scale(1.6); box-shadow: 0 0 8px 2px currentColor; }
    }

    /* ── TITLE ── */
    .title-block {
      position: relative; z-index: 10;
      text-align: center;
      margin-bottom: 18px;
      user-select: none;
    }
    .title-block h1 {
      font-size: clamp(1.9rem, 7vw, 2.9rem);
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 8px;
      text-transform: uppercase;
      animation: gold-glow 2s ease-in-out infinite alternate;
    }
    @keyframes gold-glow {
      from { text-shadow: 0 0 12px rgba(255,215,0,0.5), 0 0 24px rgba(255,215,0,0.2); }
      to   { text-shadow: 0 0 22px #FFD700, 0 0 55px rgba(255,215,0,0.65), 0 0 90px rgba(255,215,0,0.2); }
    }
    .title-block p {
      font-size: 0.62rem;
      color: rgba(255,105,180,0.72);
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* ── STAGE ── */
    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── AVATAR (whole body bounces) ── */
    .avatar {
      position: relative;
      padding-top: 60px; /* room for hair above head */
      animation: body-bounce 0.46s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      transform-origin: bottom center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes body-bounce {
      0%   { transform: translateY(0px)   rotate(-2deg) scaleY(1); }
      100% { transform: translateY(-22px) rotate(2deg)  scaleY(1.02); }
    }

    /* ── HAIR (afro puffs) ── */
    .hair-wrap {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 96px; height: 76px;
      animation: hair-jiggle 0.46s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }
    @keyframes hair-jiggle {
      0%   { transform: translateX(-50%) scaleX(1.04) scaleY(0.97) rotate(-1deg); }
      100% { transform: translateX(-50%) scaleX(0.96) scaleY(1.03) rotate(1deg); }
    }
    .hp {
      position: absolute;
      background: var(--hair);
      border-radius: 50%;
    }
    /* Afro puff arrangement */
    .hp.c  { width: 46px; height: 46px; top: 16px; left: 25px; background: var(--hair-hi); }
    .hp.t  { width: 32px; height: 32px; top:  0px; left: 32px; }
    .hp.tl { width: 36px; height: 36px; top:  6px; left:  4px; }
    .hp.tr { width: 36px; height: 36px; top:  6px; left: 56px; }
    .hp.ll { width: 38px; height: 38px; top: 24px; left: -2px; }
    .hp.lr { width: 38px; height: 38px; top: 24px; left: 60px; }
    .hp.bl { width: 30px; height: 30px; top: 42px; left:  3px; }
    .hp.br { width: 30px; height: 30px; top: 42px; left: 63px; }
    /* sheen highlight on center puff */
    .hp.c::after {
      content: '';
      position: absolute;
      width: 16px; height: 9px;
      background: rgba(255,255,255,0.13);
      border-radius: 50%;
      top: 9px; left: 12px;
      transform: rotate(-30deg);
    }

    /* ── HEAD ── */
    .head {
      position: relative;
      width: 76px; height: 82px;
      background: var(--skin);
      border-radius: 50% 50% 48% 48%;
      margin: 0 auto;
      box-shadow: inset -9px -7px 18px rgba(0,0,0,0.24), inset 5px 5px 12px rgba(255,255,255,0.08);
    }
    /* forehead highlight */
    .head::before {
      content: '';
      position: absolute;
      width: 22px; height: 13px;
      background: rgba(255,255,255,0.11);
      border-radius: 50%;
      top: 14px; left: 16px;
      transform: rotate(-22deg);
    }
    /* cheek blush */
    .head::after {
      content: '';
      position: absolute;
      width: 44px; height: 12px;
      background: rgba(210,80,80,0.2);
      border-radius: 50%;
      bottom: 22px; left: 16px;
    }

    .eye {
      position: absolute;
      width: 12px; height: 12px;
      background: #120400;
      border-radius: 50%;
      top: 33px;
      animation: blink 5.5s ease-in-out infinite;
    }
    .eye::after { /* catchlight */
      content: '';
      position: absolute;
      width: 3px; height: 3px;
      background: #fff;
      border-radius: 50%;
      top: 2px; left: 2px;
    }
    @keyframes blink {
      0%,88%,100% { transform: scaleY(1); }
      90%,93% { transform: scaleY(0.07); }
    }
    .eye.l { left: 14px; }
    .eye.r { right: 14px; }

    /* lashes */
    .lash { position: absolute; top: 31px; }
    .lash.l { left: 13px; }
    .lash.r { right: 13px; }
    .lash::before, .lash::after {
      content: '';
      position: absolute;
      width: 1.5px; height: 6px;
      background: #120400;
      border-radius: 1px;
      top: -4px;
      transform-origin: bottom center;
    }
    .lash.l::before { left: 0px;  transform: rotate(-20deg); }
    .lash.l::after  { left: 7px;  transform: rotate(-4deg); }
    .lash.r::before { right: 0px; transform: rotate(20deg); }
    .lash.r::after  { right: 7px; transform: rotate(4deg); }

    .nose {
      position: absolute;
      width: 18px; height: 11px;
      border: 2px solid rgba(0,0,0,0.25);
      border-top: none;
      border-radius: 0 0 12px 12px;
      bottom: 23px;
      left: 50%; transform: translateX(-50%);
    }

    .mouth {
      position: absolute;
      width: 30px; height: 16px;
      overflow: hidden;
      bottom: 10px;
      left: 50%; transform: translateX(-50%);
    }
    .mouth::after {
      content: '';
      position: absolute;
      width: 30px; height: 30px;
      border: 3px solid #7B2240;
      border-radius: 50%;
      top: 0; left: 0;
    }

    /* inner lip shine */
    .mouth::before {
      content: '';
      position: absolute;
      width: 14px; height: 5px;
      background: rgba(255,150,150,0.3);
      border-radius: 50%;
      bottom: 2px;
      left: 8px;
      z-index: 1;
    }

    /* earrings */
    .ear {
      position: absolute;
      width: 7px; height: 15px;
      background: linear-gradient(180deg, var(--gold), #E09900);
      border-radius: 4px;
      top: 48px;
    }
    .ear::after {
      content: '';
      position: absolute;
      width: 10px; height: 10px;
      background: radial-gradient(circle, #FFE870, var(--gold));
      border-radius: 50%;
      bottom: -8px; left: -1px;
      box-shadow: 0 0 6px rgba(255,215,0,0.75);
    }
    .ear.l { left: -5px; }
    .ear.r { right: -5px; }

    /* ── NECK ── */
    .neck {
      width: 25px; height: 18px;
      background: var(--skin);
      margin: -4px auto 0;
      border-radius: 0 0 6px 6px;
      position: relative; z-index: 2;
      box-shadow: inset -3px 0 6px rgba(0,0,0,0.15);
    }

    /* ── TORSO + ARMS ── */
    .torso-wrap {
      position: relative;
      width: 124px;
      display: flex;
      justify-content: center;
      margin-top: -3px;
    }

    .arm {
      position: absolute;
      width: 19px; height: 68px;
      background: linear-gradient(180deg, var(--skin-shadow) 0%, var(--skin) 100%);
      border-radius: 10px;
      top: 5px;
    }
    .arm::after { /* hand */
      content: '';
      position: absolute;
      width: 17px; height: 17px;
      background: var(--skin);
      border-radius: 50%;
      bottom: -8px; left: 1px;
    }
    .arm.l {
      left: 1px;
      transform-origin: top center;
      animation: arm-l 0.46s ease-in-out infinite alternate;
    }
    @keyframes arm-l {
      0%   { transform: rotate(-50deg); }
      100% { transform: rotate(60deg); }
    }
    .arm.r {
      right: 1px;
      transform-origin: top center;
      animation: arm-r 0.46s ease-in-out infinite alternate;
    }
    @keyframes arm-r {
      0%   { transform: rotate(50deg); }
      100% { transform: rotate(-60deg); }
    }

    /* ── DRESS ── */
    .dress {
      width: 94px; height: 108px;
      background: linear-gradient(155deg, var(--purple-lt) 0%, var(--purple) 45%, #48116A 100%);
      border-radius: 18px 18px 38% 38%;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 6px 12px rgba(255,255,255,0.1), inset 0 -6px 18px rgba(0,0,0,0.3);
      animation: dress-sway 0.46s ease-in-out infinite alternate;
      transform-origin: top center;
    }
    @keyframes dress-sway {
      0%   { transform: skewX(-2.5deg); }
      100% { transform: skewX(2.5deg); }
    }
    /* diagonal sheen */
    .dress::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(255,255,255,0.03) 10px,
        rgba(255,255,255,0.03) 11px
      );
    }
    /* gold belt */
    .belt {
      position: absolute;
      top: 32px; left: 8px; right: 8px;
      height: 11px;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold) 40%, var(--gold-dim));
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(255,215,0,0.55);
    }
    /* belt gem */
    .belt::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      background: radial-gradient(circle, #fff 0%, var(--gold) 50%, var(--gold-dim) 100%);
      border-radius: 50%;
      top: -1px; left: 50%; transform: translateX(-50%);
      box-shadow: 0 0 8px rgba(255,215,0,0.9);
    }

    /* ── LEGS ── */
    .legs {
      display: flex;
      gap: 5px;
      justify-content: center;
      margin-top: 7px;
    }
    .leg {
      width: 25px; height: 75px;
      background: linear-gradient(180deg, #48116A 0%, #48116A 44%, var(--skin) 58%, var(--skin) 100%);
      border-radius: 4px 4px 8px 8px;
      position: relative;
    }
    /* shoe */
    .leg::before {
      content: '';
      position: absolute;
      bottom: -11px; left: -5px;
      width: 35px; height: 14px;
      background: linear-gradient(135deg, #1A0900, #2E1400);
      border-radius: 2px 6px 8px 5px;
      box-shadow: 0 3px 7px rgba(0,0,0,0.55);
    }
    /* stiletto heel */
    .leg::after {
      content: '';
      position: absolute;
      bottom: -20px; right: 1px;
      width: 5px; height: 11px;
      background: var(--gold);
      border-radius: 1px 1px 2px 2px;
      box-shadow: 0 0 5px rgba(255,215,0,0.6);
    }
    .leg.l {
      transform-origin: top center;
      animation: leg-l 0.46s ease-in-out infinite alternate;
    }
    @keyframes leg-l {
      0%   { transform: rotate(-16deg); }
      100% { transform: rotate(9deg); }
    }
    .leg.r {
      transform-origin: top center;
      animation: leg-r 0.46s ease-in-out infinite alternate;
    }
    @keyframes leg-r {
      0%   { transform: rotate(9deg); }
      100% { transform: rotate(-16deg); }
    }

    /* ── FLOOR SHADOW ── */
    .av-shadow {
      width: 105px; height: 22px;
      background: radial-gradient(ellipse, rgba(123,45,139,0.5) 0%, transparent 70%);
      border-radius: 50%;
      margin: 16px auto 0;
      animation: sh-pulse 0.46s ease-in-out infinite alternate;
    }
    @keyframes sh-pulse {
      0%   { transform: scaleX(1.12); opacity: 0.75; }
      100% { transform: scaleX(0.62); opacity: 0.28; }
    }

    /* ── TAP RIPPLE ── */
    .ripple {
      position: fixed;
      border-radius: 50%;
      background: rgba(255,215,0,0.18);
      pointer-events: none;
      animation: ripple-out 0.65s ease-out forwards;
    }
    @keyframes ripple-out {
      from { transform: scale(0); opacity: 1; }
      to   { transform: scale(5); opacity: 0; }
    }

    /* ── FOOTER ── */
    .footer {
      position: fixed;
      bottom: max(22px, env(safe-area-inset-bottom, 22px));
      left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.28);
      font-size: 0.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      user-select: none;
    }

    /* Speed toggle flash */
    .speed-flash {
      position: fixed;
      inset: 0;
      background: rgba(255,215,0,0.08);
      pointer-events: none;
      animation: flash-fade 0.4s ease-out forwards;
    }
    @keyframes flash-fade {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Ambient glow lights -->
  <div class="ambient amb-1"></div>
  <div class="ambient amb-2"></div>
  <div class="ambient amb-3"></div>

  <!-- Disco floor -->
  <div class="floor">
    <div class="floor-grid"></div>
    <div class="floor-glow"></div>
  </div>

  <!-- Title -->
  <div class="title-block">
    <h1>✨ DIVINE ✨</h1>
    <p>She moves different</p>
  </div>

  <!-- Avatar Stage -->
  <div class="stage">
    <div class="avatar" id="avatar">

      <!-- Afro hair -->
      <div class="hair-wrap">
        <div class="hp t"></div>
        <div class="hp tl"></div>
        <div class="hp tr"></div>
        <div class="hp ll"></div>
        <div class="hp lr"></div>
        <div class="hp c"></div>
        <div class="hp bl"></div>
        <div class="hp br"></div>
      </div>

      <!-- Head & face -->
      <div class="head">
        <div class="eye l"></div>
        <div class="eye r"></div>
        <div class="lash l"></div>
        <div class="lash r"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
        <div class="ear l"></div>
        <div class="ear r"></div>
      </div>

      <!-- Neck -->
      <div class="neck"></div>

      <!-- Torso + swinging arms -->
      <div class="torso-wrap">
        <div class="arm l"></div>
        <div class="dress">
          <div class="belt"></div>
        </div>
        <div class="arm r"></div>
      </div>

      <!-- Stepping legs -->
      <div class="legs">
        <div class="leg l"></div>
        <div class="leg r"></div>
      </div>

    </div>

    <!-- Purple glow shadow on floor -->
    <div class="av-shadow"></div>
  </div>

  <p class="footer">Tap to speed up &nbsp;·&nbsp; Add to Home Screen</p>

  <script>
    // PWA service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // ── Floating music notes ──
    const noteChars  = ['♪','♫','♬','♩','♭','♮'];
    const noteColors = ['#FFD700','#ff69b4','#B060D0','#00E5FF','#ffffff'];
    for (let i = 0; i < 8; i++) {
      const n = document.createElement('span');
      n.className = 'note';
      n.textContent = noteChars[i % noteChars.length];
      n.style.cssText = `
        left:${6 + Math.random() * 88}%;
        bottom:32%;
        color:${noteColors[i % noteColors.length]};
        animation-duration:${2.3 + Math.random() * 2}s;
        animation-delay:${Math.random() * 3.5}s;
      `;
      document.body.appendChild(n);
    }

    // ── Sparkle stars ──
    const spColors = ['#FFD700','#ff69b4','#9B4DB3','#00E5FF','#ffffff'];
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.cssText = `
        left:${Math.random() * 100}%;
        top:${5 + Math.random() * 65}%;
        background:${spColors[i % spColors.length]};
        animation-duration:${1.2 + Math.random() * 2.2}s;
        animation-delay:${Math.random() * 2.5}s;
      `;
      document.body.appendChild(s);
    }

    // ── Tap interaction: toggle dance speed + ripple ──
    let fast = false;
    const ANIMATED_SELECTORS = '.avatar,.arm,.leg,.dress,.hair-wrap';

    document.addEventListener('click', (e) => {
      // Gold ripple
      const ripple = document.createElement('div');
      const size = 70;
      ripple.className = 'ripple';
      ripple.style.cssText = `
        width:${size}px; height:${size}px;
        left:${e.clientX - size/2}px;
        top:${e.clientY - size/2}px;
      `;
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 700);

      // Screen flash
      const flash = document.createElement('div');
      flash.className = 'speed-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 450);

      // Toggle speed
      fast = !fast;
      const dur = fast ? '0.20s' : '0.46s';
      document.querySelectorAll(ANIMATED_SELECTORS).forEach(el => {
        el.style.animationDuration = dur;
      });
    });

    // Prevent double-tap zoom on iOS
    let lastTap = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTap < 300) e.preventDefault();
      lastTap = now;
    }, { passive: false });
  </script>
</body>
</html>
