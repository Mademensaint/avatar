<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1A0533"/>
      <stop offset="100%" stop-color="#08011A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B4DB3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9B4DB3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <!-- Purple glow -->
  <ellipse cx="90" cy="130" rx="70" ry="40" fill="url(#glow)"/>
  <!-- Gold title text -->
  <text x="90" y="48" font-family="-apple-system,sans-serif" font-size="13" font-weight="900"
        fill="#FFD700" text-anchor="middle" letter-spacing="3">DIVINE</text>
  <!-- Dancing figure emoji -->
  <text x="90" y="130" font-size="78" text-anchor="middle">💃</text>
  <!-- Sparkles -->
  <text x="28" y="68" font-size="20">✨</text>
  <text x="140" y="68" font-size="20">✨</text>
</svg>
